<svg viewBox="0 0 1050 780" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1050" height="780" fill="#ffffff"/>
  <text x="525" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">PicoRV32 Core — Actual Datapath</text>
  <text x="525" y="48" text-anchor="middle" font-size="12" fill="#6b7280">Multi-cycle, sequential design (~4 CPI) — NOT a pipeline. One instruction fully finishes before the next starts.</text>

  <!-- Central Control FSM -->
  <rect x="380" y="330" width="290" height="110" rx="10" fill="#1e3a8a" stroke="#111827" stroke-width="2.5"/>
  <text x="525" y="365" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Sequential Control FSM</text>
  <text x="525" y="384" text-anchor="middle" font-size="11" fill="#dbeafe">Fetch → Decode → Execute → Mem/WB</text>
  <text x="525" y="402" text-anchor="middle" font-size="11" fill="#dbeafe">one instruction at a time, ~4 cycles avg</text>
  <text x="525" y="420" text-anchor="middle" font-size="10" fill="#fca5a5">(the "brain" that runs everything below)</text>

  <!-- Program Counter -->
  <rect x="150" y="150" width="160" height="70" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="230" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Program Counter</text>
  <text x="230" y="198" text-anchor="middle" font-size="10" fill="#4b5563">tracks which instruction is next</text>

  <!-- Instruction Decoder -->
  <rect x="380" y="150" width="290" height="90" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="525" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Instruction Decoder</text>
  <text x="525" y="196" text-anchor="middle" font-size="10" fill="#4b5563">reads the 32-bit instruction word,</text>
  <text x="525" y="212" text-anchor="middle" font-size="10" fill="#4b5563">figures out R/I/S/B/U/J type (from 1.2)</text>
  <text x="525" y="228" text-anchor="middle" font-size="10" fill="#4b5563">and whether it's a custom0 IRQ opcode</text>

  <!-- Register File -->
  <rect x="750" y="150" width="240" height="90" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="870" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Register File</text>
  <text x="870" y="196" text-anchor="middle" font-size="10" fill="#4b5563">x0–x31 (32 general regs)</text>
  <text x="870" y="212" text-anchor="middle" font-size="10" fill="#374151" font-weight="700">+ q0–q3 IF ENABLE_IRQ_QREGS=1</text>
  <text x="870" y="228" text-anchor="middle" font-size="9" fill="#6b7280">(else return addr/mask use x3/x4 instead)</text>

  <!-- ALU -->
  <rect x="750" y="330" width="240" height="90" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="870" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">ALU</text>
  <text x="870" y="376" text-anchor="middle" font-size="10" fill="#4b5563">add/sub/shift/compare (base RV32I)</text>
  <text x="870" y="394" text-anchor="middle" font-size="10" fill="#4b5563">+ mul/div ONLY if ENABLE_MUL/DIV=1</text>
  <text x="870" y="410" text-anchor="middle" font-size="9" fill="#b91c1c">(we CUT these — done in software instead)</text>

  <!-- PCPI (optional, dashed) -->
  <rect x="750" y="450" width="240" height="70" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="870" y="475" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">PCPI Interface</text>
  <text x="870" y="492" text-anchor="middle" font-size="9" fill="#7f1d1d">external co-processor hookup</text>
  <text x="870" y="507" text-anchor="middle" font-size="9" fill="#7f1d1d">CUT — unused once mul/div are cut</text>

  <!-- Memory Interface (shared I+D, von Neumann) -->
  <rect x="380" y="560" width="290" height="100" rx="8" fill="#f3f4f6" stroke="#4b5563" stroke-width="1.5"/>
  <text x="525" y="588" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Single Memory Interface</text>
  <text x="525" y="606" text-anchor="middle" font-size="10" fill="#4b5563">mem_valid/ready/addr/wdata/rdata</text>
  <text x="525" y="622" text-anchor="middle" font-size="10" fill="#4b5563">ONE shared bus for BOTH instruction</text>
  <text x="525" y="638" text-anchor="middle" font-size="10" fill="#4b5563">fetches AND data reads/writes</text>
  <text x="525" y="653" text-anchor="middle" font-size="9" fill="#6b7280">(this is what picosoc.v connects to RAM/SPI/UART)</text>

  <!-- IRQ Controller -->
  <rect x="150" y="330" width="180" height="140" rx="8" fill="#fffbeb" stroke="#92400e" stroke-width="2"/>
  <text x="240" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#78350f">IRQ Controller</text>
  <text x="240" y="378" text-anchor="middle" font-size="10" fill="#78350f">32 IRQ input lines</text>
  <text x="240" y="394" text-anchor="middle" font-size="10" fill="#78350f">(IRQ0-2 internal: timer,</text>
  <text x="240" y="408" text-anchor="middle" font-size="10" fill="#78350f">illegal-insn, bus error)</text>
  <text x="240" y="428" text-anchor="middle" font-size="10" fill="#78350f" font-weight="700">only exists IF</text>
  <text x="240" y="444" text-anchor="middle" font-size="10" fill="#78350f" font-weight="700">ENABLE_IRQ = 1</text>
  <text x="240" y="460" text-anchor="middle" font-size="9" fill="#92400e">(picosoc.v exposes 3 of these:</text>

  <!-- IRQ external input -->
  <line x1="60" y1="400" x2="150" y2="400" stroke="#92400e" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="30" y="390" font-size="10" fill="#78350f">irq[31:0]</text>
  <text x="15" y="405" font-size="9" fill="#78350f">from AFE,</text>
  <text x="15" y="417" font-size="9" fill="#78350f">AI Engine,</text>
  <text x="15" y="429" font-size="9" fill="#78350f">Wireless Tx</text>

  <!-- Arrows: PC <-> Decoder -->
  <line x1="310" y1="190" x2="380" y2="190" stroke="#1f2937" stroke-width="2" marker-end="url(#a1)"/>
  <!-- Decoder -> Control FSM -->
  <line x1="525" y1="240" x2="525" y2="330" stroke="#1f2937" stroke-width="2" marker-end="url(#a1)"/>
  <!-- Control FSM -> PC (branch/jump updates) -->
  <path d="M380,350 C260,320 230,260 230,220" stroke="#1f2937" stroke-width="1.5" fill="none" marker-end="url(#a1)" stroke-dasharray="4,3"/>
  <text x="235" y="290" font-size="9" fill="#4b5563">branch/jump target</text>

  <!-- Control FSM <-> Register File -->
  <line x1="670" y1="360" x2="750" y2="220" stroke="#1f2937" stroke-width="2" marker-end="url(#a1)" marker-start="url(#a1)"/>
  <text x="690" y="280" font-size="9" fill="#4b5563">read rs1/rs2, write rd</text>

  <!-- Control FSM <-> ALU -->
  <line x1="670" y1="375" x2="750" y2="375" stroke="#1f2937" stroke-width="2" marker-end="url(#a1)" marker-start="url(#a1)"/>

  <!-- ALU -> PCPI (dashed) -->
  <line x1="870" y1="420" x2="870" y2="450" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a2)"/>

  <!-- Control FSM <-> Memory Interface -->
  <line x1="525" y1="440" x2="525" y2="560" stroke="#1f2937" stroke-width="2" marker-end="url(#a1)" marker-start="url(#a1)"/>
  <text x="535" y="500" font-size="9" fill="#4b5563">instruction fetch AND</text>
  <text x="535" y="513" font-size="9" fill="#4b5563">load/store data (shared)</text>

  <!-- IRQ Controller <-> Control FSM -->
  <line x1="330" y1="400" x2="380" y2="390" stroke="#92400e" stroke-width="2" marker-end="url(#a1)"/>
  <text x="335" y="380" font-size="9" fill="#78350f">triggers interrupt</text>

  <!-- Legend -->
  <rect x="60" y="700" width="930" height="65" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="75" y="720" font-size="11" fill="#111827" font-weight="700">Reading this diagram:</text>
  <text x="75" y="738" font-size="10" fill="#374151">Solid box + solid border = always present. Dashed border = only exists if its parameter is enabled (e.g. PCPI only if ENABLE_PCPI=1).</text>
  <text x="75" y="753" font-size="10" fill="#374151">Everything here lives inside the ONE "CPU Core" box from the Zoom 1 diagram — this is what's actually inside that box.</text>
</svg>
