<svg viewBox="0 0 1100 750" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/>
    </marker>
    <marker id="arRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1100" height="750" fill="#ffffff"/>
  <text x="550" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">System-Level Operational State Machine (Category A)</text>
  <text x="550" y="48" text-anchor="middle" font-size="11" fill="#6b7280">Every arrow here is one of the 6 Category A verification scenarios</text>

  <!-- RESET -->
  <rect x="440" y="70" width="220" height="70" rx="10" fill="#7f1d1d" stroke="#111827" stroke-width="2"/>
  <text x="550" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">RESET</text>
  <text x="550" y="118" text-anchor="middle" font-size="9" fill="#fecaca">boots at 0x0010_0000 (flash)</text>

  <!-- INIT -->
  <rect x="420" y="200" width="260" height="90" rx="10" fill="#1e3a8a" stroke="#111827" stroke-width="2"/>
  <text x="550" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">POWER-UP / INIT</text>
  <text x="550" y="246" text-anchor="middle" font-size="9" fill="#dbeafe">read EEPROM coeffs, init AI Engine,</text>
  <text x="550" y="260" text-anchor="middle" font-size="9" fill="#dbeafe">init SPI master, set IRQ mask</text>
  <text x="550" y="278" text-anchor="middle" font-size="9" fill="#fde68a" font-weight="700">A1 / A2</text>

  <!-- NORMAL OP -->
  <rect x="420" y="340" width="260" height="90" rx="10" fill="#166534" stroke="#111827" stroke-width="2"/>
  <text x="550" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">NORMAL OPERATION</text>
  <text x="550" y="386" text-anchor="middle" font-size="9" fill="#dcfce7">continuous AFE acquisition,</text>
  <text x="550" y="400" text-anchor="middle" font-size="9" fill="#dcfce7">relay to AI Engine, monitor status</text>

  <!-- ANOMALY -->
  <rect x="770" y="340" width="230" height="90" rx="10" fill="#854d0e" stroke="#111827" stroke-width="2"/>
  <text x="885" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">ANOMALY HANDLING</text>
  <text x="885" y="386" text-anchor="middle" font-size="9" fill="#fef3c7">forward alert to</text>
  <text x="885" y="400" text-anchor="middle" font-size="9" fill="#fef3c7">Wireless Tx, then return</text>

  <!-- SLEEP -->
  <rect x="80" y="340" width="230" height="90" rx="10" fill="#374151" stroke="#111827" stroke-width="2"/>
  <text x="195" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">SLEEP (waitirq)</text>
  <text x="195" y="386" text-anchor="middle" font-size="9" fill="#d1d5db">CPU paused, waiting</text>
  <text x="195" y="400" text-anchor="middle" font-size="9" fill="#d1d5db">for any interrupt</text>
  <text x="195" y="416" text-anchor="middle" font-size="9" fill="#fde68a" font-weight="700">A5 / A6</text>

  <!-- Arrows -->
  <line x1="550" y1="140" x2="550" y2="200" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="565" y="175" font-size="10" fill="#1f2937">power stable</text>

  <line x1="550" y1="290" x2="550" y2="340" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="565" y="320" font-size="10" fill="#1f2937">init complete</text>

  <line x1="680" y1="385" x2="770" y2="385" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="695" y="375" font-size="9" fill="#1f2937">anomaly detected</text>
  <line x1="770" y1="405" x2="680" y2="405" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
  <text x="695" y="420" font-size="9" fill="#1f2937">report sent, resume</text>

  <line x1="420" y1="405" x2="310" y2="405" stroke="#1f2937" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="330" y="395" font-size="9" fill="#1f2937">idle detected</text>
  <line x1="310" y1="385" x2="420" y2="385" stroke="#1f2937" stroke-width="2" marker-end="url(#ar)"/>
  <text x="330" y="375" font-size="9" fill="#1f2937">IRQ wakes CPU</text>

  <!-- Reset from anywhere (dashed red, converging) -->
  <path d="M195,340 C195,150 440,90 440,90" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arRed)"/>
  <path d="M550,340 C550,320 500,140 500,140" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arRed)"/>
  <path d="M885,340 C885,150 600,90 600,90" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arRed)"/>
  <text x="850" y="200" font-size="10" fill="#b91c1c" font-weight="700">reset (any state) — A3 / A4</text>

  <!-- Assumption note -->
  <rect x="80" y="480" width="920" height="90" rx="8" fill="#fffbeb" stroke="#92400e" stroke-width="1.5"/>
  <text x="100" y="505" font-size="12" font-weight="700" fill="#78350f">Assumption stated explicitly (A4 — brown-out):</text>
  <text x="100" y="525" font-size="11" fill="#78350f">PicoRV32 has no on-chip brown-out detection circuit. We assume an external supervisor chip asserts</text>
  <text x="100" y="543" font-size="11" fill="#78350f">the reset line on brown-out — meaning brown-out is verified as just another path INTO the same RESET</text>
  <text x="100" y="561" font-size="11" fill="#78350f">state shown above, not as its own separate state. This should be raised as a question for Ai Linear.</text>

  <!-- Legend -->
  <rect x="80" y="600" width="920" height="60" rx="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="100" y="622" font-size="11" fill="#111827" font-weight="700">Legend:</text>
  <text x="100" y="642" font-size="10" fill="#374151">Solid black = normal operational transition. Dashed red = reset, reachable from every state (async, highest priority).</text>
</svg>
